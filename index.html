<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#14233f"><title>Pegadas | Gestão de Viagens</title><style>
:root{--navy:#14233f;--pink:#a32662;--light:#f5f6fa;--ink:#1e293b;--muted:#667085;--line:#e3e6ed}*{box-sizing:border-box}body{margin:0;font:15px system-ui,-apple-system,Segoe UI,sans-serif;background:var(--light);color:var(--ink)}header{background:var(--navy);color:white;padding:24px max(18px,calc((100vw - 1050px)/2));}header small{color:#e7b8d0;letter-spacing:.12em}h1{margin:5px 0;font-size:26px}header p{margin:4px 0;color:#cbd5e1}main{max-width:1050px;margin:auto;padding:18px}nav{display:flex;gap:8px;overflow:auto;padding-bottom:12px}nav button{white-space:nowrap;border:1px solid #d9dce4;background:white;color:var(--navy);border-radius:12px;padding:12px 14px;font-weight:650}nav button.active{background:var(--pink);color:white;border-color:var(--pink)}.panel{background:white;border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:16px;box-shadow:0 3px 14px #14233f08}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.metric{background:#f6f2f6;border-radius:14px;padding:16px}.metric strong{display:block;font-size:21px;color:var(--navy);margin-top:7px}.metric small{color:var(--muted)}h2{margin:0 0 14px;color:var(--navy);font-size:19px}h3{font-size:16px;margin:12px 0}label{display:block;font-size:13px;font-weight:650;margin:10px 0 5px}input,select,textarea{width:100%;padding:11px;border:1px solid #cfd5df;border-radius:10px;background:white;color:var(--ink);font:inherit}textarea{min-height:80px}button.primary{background:var(--pink);color:white;border:0;border-radius:11px;padding:12px 17px;font-weight:700;cursor:pointer}button.secondary{background:white;border:1px solid #b9c1d0;border-radius:11px;padding:11px 14px;color:var(--navy);font-weight:650;cursor:pointer}button.danger{background:white;color:#a61c39;border:1px solid #e6aab8;border-radius:9px;padding:7px 10px}button:focus,input:focus,select:focus{outline:2px solid #d981a9;outline-offset:2px}.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.muted{color:var(--muted)}.hint{font-size:12px;color:var(--muted)}.tag{display:inline-block;background:#f4e5ed;color:#84214d;padding:4px 9px;border-radius:50px;font-size:12px}.record{padding:13px 0;border-bottom:1px solid var(--line);display:flex;align-items:start;justify-content:space-between;gap:10px}.record:last-child{border:0}.record b{display:block}.record small{color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap}.hidden{display:none!important}.notice{background:#fff7e8;border:1px solid #f2d9a5;border-radius:12px;padding:12px;font-size:13px}.foot{font-size:12px;color:var(--muted);text-align:center;margin:25px}.pill{border-radius:8px;padding:4px 7px;background:#edf0f7;color:#24334e;font-size:12px}@media(max-width:600px){.cols,.three{grid-template-columns:1fr}header{padding:22px 18px}main{padding:12px}.panel{padding:14px}.record{align-items:start}}@media print{header,nav,form,.actions,.no-print{display:none!important}main{max-width:none}.panel{break-inside:avoid;box-shadow:none}}
#workspace{display:none}body.entered #chooser{display:none}body.entered #workspace{display:block}.go-btn{background:#a32662;color:white;border:0;border-radius:12px;padding:14px 32px;font-size:17px;font-weight:750;cursor:pointer;width:100%;margin-top:14px}#backButton{margin-bottom:12px}@media(max-width:600px){.go-btn{width:100%}}

</style></head><body><header><small>PEGADAS DE UMA VIAGEM</small><h1>Gestão de Viagens</h1><p>Meu controle pessoal de viagens</p></header><main><div id="chooser"><div class="panel"><div class="cols"><div><label>País / viagem</label><select id="tripSelect"><option value="th">🇹🇭 Tailândia 2026</option></select></div><div><label>Grupo / período</label><select id="groupSelect"><option value="g1">Grupo 1 · Woman Trip</option><option value="off">Período entre grupos</option><option value="g2">Grupo 2 · Woman Trip</option><option value="g3">Grupo 3 · Woman Trip</option></select></div></div><button type="button" class="go-btn" onclick="enterGroup()">Ir para o grupo →</button><div class="actions" style="margin-top:12px"><button class="secondary" onclick="addTrip()">+ Novo país</button><button class="secondary" onclick="addGroup()">+ Novo grupo</button><button class="secondary" onclick="exportData()">Exportar backup</button><button class="secondary" onclick="document.getElementById('importFile').click()">Importar backup</button><input id="importFile" class="hidden" type="file" accept="application/json" onchange="importData(event)"></div></div></div><div id="workspace"><button id="backButton" class="secondary" onclick="backToChooser()">← Trocar grupo</button><nav id="nav"></nav><section id="content"></section></div><p class="foot">Seus dados são armazenados neste navegador. Exporte backups regularmente. Esta versão não sincroniza dispositivos nem possui login.</p></main><script>function enterGroup(){document.body.classList.add("entered");if(typeof render==="function")render();window.scrollTo(0,0)}function backToChooser(){document.body.classList.remove("entered");window.scrollTo(0,0)}
const KEY='pegadas-gestao-th2026-v2';const tabs=[['inicio','Meu painel'],['preparacao','Antes do grupo'],['biblioteca','Biblioteca'],['pendencias','Pendências'],['caixa','Caixa da viagem'],['despesas','Despesas pessoais'],['hospedagens','Hospedagens'],['avaliacoes','Avaliações'],['relatorio','Relatórios']];const seed={trips:[{id:'th',country:'Tailândia',name:'Tailândia 2026'}],groups:[{id:'g1',trip:'th',name:'Grupo 1 · Woman Trip',start:'2026-11-20',end:'2026-12-03',rate:70,rateCurrency:'USD',paid:false,dayType:'work'},{id:'off',trip:'th',name:'Período entre grupos',start:'2026-12-04',end:'2026-12-25',rate:20,rateCurrency:'USD',paid:false,dayType:'off'},{id:'g2',trip:'th',name:'Grupo 2 · Woman Trip',start:'2026-12-26',end:'2027-01-06',rate:70,rateCurrency:'USD',paid:false,dayType:'work'},{id:'g3',trip:'th',name:'Grupo 3 · Woman Trip',start:'',end:'',rate:70,rateCurrency:'USD',paid:false,dayType:'work'}],records:[],reviews:[]};let db;try{db=JSON.parse(localStorage.getItem(KEY))||JSON.parse(JSON.stringify(seed))}catch{db=JSON.parse(JSON.stringify(seed))}let trip=db.trips[0]?.id,group=db.groups.find(x=>x.trip===trip)?.id,tab='inicio';const $=x=>document.getElementById(x);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=(n,c)=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:c||'BRL'}).format(+n||0);const fmt=d=>d?new Date(d+'T12:00:00').toLocaleDateString('pt-BR'):'';const uid=()=>Math.random().toString(36).slice(2)+Date.now().toString(36);const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}render()};const currentGroup=()=>db.groups.find(g=>g.id===group);const scoped=()=>db.records.filter(r=>r.trip===trip&&r.group===group);const countDays=(a,b)=>a&&b?Math.max(0,Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/86400000)+1):0;let currencies=['BRL','USD','EUR','THB','GBP','JPY','MAD','EGP','TRY','ZAR','AED','PEN'];try{currencies=Intl.supportedValuesOf('currency')}catch{}const currencyOptions=(selected='USD')=>currencies.map(c=>`<option value="${c}" ${c===selected?'selected':''}>${c}</option>`).join('');const formField=(name,label,type='text',value='',extra='')=>`<div><label>${label}</label><input name="${name}" type="${type}" value="${esc(value)}" ${extra}></div>`;const currencyField=(val='USD')=>`<div><label>Moeda</label><select name="currency">${currencyOptions(val)}</select></div>`;const selectField=(name,label,options)=>`<div><label>${label}</label><select name="${name}">${options.map(([v,l])=>`<option value="${v}">${l}</option>`).join('')}</select></div>`;const panel=(title,body)=>`<div class="panel"><h2>${title}</h2>${body}</div>`;const metric=(label,val,small='')=>`<div class="metric"><small>${label}</small><strong>${val}</strong><small>${small}</small></div>`;const byCurrency=(rs)=>{let sums={};rs.forEach(r=>sums[r.currency]=(sums[r.currency]||0)+Number(r.amount));return Object.entries(sums).map(([c,n])=>money(n,c)).join(' · ')||'—'};const recordList=(rs)=>rs.length?rs.sort((a,b)=>b.date.localeCompare(a.date)).map(r=>`<div class="record"><div><b>${esc(r.name)}</b><small>${fmt(r.date)} · ${esc(kinds[r.kind]||r.kind)} · ${r.paid?'Pago/recebido':'Pendente'}</small><div class="hint">${esc(r.notes||'')}</div></div><div style="text-align:right"><b>${money(r.amount,r.currency)}</b>${r.kind==='lodging'?`<button class="secondary no-print" onclick="editLodging('${r.id}')">Editar</button>`:''}<button class="danger no-print" onclick="removeRecord('${r.id}')">Excluir</button></div></div>`).join(''):'<p class="muted">Nenhum lançamento ainda.</p>';db.tasks ||= [];db.library ||= {};const kinds={receipt:'Recebimento viajante',supplier:'Pagamento fornecedor',transfer:'Repasse Woman Trip',personal:'Despesa pessoal',lodging:'Hospedagem'};
function render(){if(!db.trips.some(t=>t.id===trip))trip=db.trips[0]?.id;if(!db.groups.some(g=>g.id===group&&g.trip===trip))group=db.groups.find(g=>g.trip===trip)?.id; $('tripSelect').innerHTML=db.trips.map(t=>`<option value="${t.id}" ${t.id===trip?'selected':''} >${t.country==='Tailândia'?'🇹🇭 ':t.country==='Egito'?'🇪🇬 ':''}${esc(t.name)}</option>`).join('');$('groupSelect').innerHTML=db.groups.filter(g=>g.trip===trip).map(g=>`<option value="${g.id}" ${g.id===group?'selected':''}>${esc(g.name)}</option>`).join('');$('tripSelect').onchange=e=>{trip=e.target.value;group=db.groups.find(g=>g.trip===trip)?.id;render()};$('groupSelect').onchange=e=>{group=e.target.value;render()};$('nav').innerHTML=tabs.map(([id,label])=>`<button class="${tab===id?'active':''}" onclick="tab='${id}';render()">${label}</button>`).join('');let g=currentGroup();if(!g){$('content').innerHTML=panel('Grupo · pronto para cadastrar', 'O país já está disponível. Toque em <b>+ Novo grupo</b> para cadastrar o período da viagem ao Egito.');return}let rs=scoped(),receipts=rs.filter(r=>r.kind==='receipt'&&r.paid),suppliers=rs.filter(r=>r.kind==='supplier'&&r.paid),transfers=rs.filter(r=>r.kind==='transfer'&&r.paid),lodgings=rs.filter(r=>r.kind==='lodging'),personal=rs.filter(r=>r.kind==='personal');let days=countDays(g.start,g.end),isOff=g.dayType==='off',dailyUSD=isOff?20:70,salaryUSD=days*dailyUSD,eurRate=Number(db.usdEurRate)||0,salaryEUR=eurRate?salaryUSD*eurRate:null,salary=salaryUSD;let content='';
if(tab==='inicio'){
const tasks=db.tasks.filter(t=>t.trip===trip&&t.group===group&&!t.done);
const reimb=lodgings.filter(r=>r.reimbursable);
const outstanding=reimb.filter(r=>!r.paid);
const paidCash=rs.filter(r=>r.paid&&['receipt','supplier','transfer'].includes(r.kind));
const balances={};paidCash.forEach(r=>balances[r.currency]=(balances[r.currency]||0)+(r.kind==='receipt'?1:-1)*Number(r.amount));
content=`<div class="welcome"><div><small>${esc(db.trips.find(t=>t.id===trip)?.name||'Viagem')} · ${esc(g.name)}</small><h2>Meu painel</h2><p>${g.start?fmt(g.start):'Datas a definir'} ${g.end?'— '+fmt(g.end):''}</p></div><span class="welcome-icon">✈️</span></div>`+
panel('Resumo rápido',`<div class="grid compact">${metric('Salário previsto',money(salaryUSD,'USD'),days+' diárias')}${metric('Saldo em caixa',Object.entries(balances).map(([c,n])=>money(n,c)).join(' · ')||'—','Entradas − saídas confirmadas')}${metric('Despesas pessoais',byCurrency(personal.filter(r=>r.paid)),'Pagas')}${metric('Hospedagens a pagar',byCurrency(outstanding),'Reembolsáveis')}${metric('Pendências',String(tasks.length),'Tarefas em aberto')}</div><p class="hint">Cada moeda é apresentada separadamente, sem conversão automática.</p>`)+
panel('Acessos rápidos',`<div class="quick-grid"><button onclick="tab='caixa';render()">💵<b>Caixa</b><small>Entradas e saídas</small></button><button onclick="tab='despesas';render()">🍜<b>Despesas</b><small>Gastos pessoais</small></button><button onclick="tab='hospedagens';render()">🛏️<b>Hospedagens</b><small>Pagamentos e reembolsos</small></button><button onclick="tab='preparacao';render()">📋<b>Antes do grupo</b><small>Checklist</small></button><button onclick="tab='biblioteca';render()">📚<b>Biblioteca</b><small>Pautas por país</small></button><button onclick="tab='pendencias';render()">✅<b>Pendências</b><small>${tasks.length} em aberto</small></button></div>`)+
panel('Para não esquecer',tasks.length?tasks.slice(0,5).map(t=>`<div class="record"><div><b>${esc(t.title)}</b><small>${t.due?fmt(t.due):'Sem data'}</small></div><button class="secondary" onclick="toggleTask('${t.id}')">Concluir</button></div>`).join(''):'<p class="muted">Tudo em dia! Adicione lembretes na aba Pendências.</p>')+
`<details class="panel"><summary>⚙️ Configurações do grupo e salário</summary><div class="detail-body"><h3>Dados do grupo</h3><form onsubmit="updateGroup(event)"><div class="cols">${formField('start','Início','date',g.start)}${formField('end','Fim','date',g.end)}<div><label>Tipo de diária</label><select name="dayType"><option value="work" ${!isOff?'selected':''}>Trabalhada — US$ 70/dia</option><option value="off" ${isOff?'selected':''}>Não trabalhada — US$ 20/dia</option></select></div></div><label><input style="width:auto" type="checkbox" name="paid" ${g.paid?'checked':''}> Salário já recebido</label><p><button class="primary">Salvar grupo</button></p></form><h3>Conversão USD → EUR</h3><p class="hint">Cotação informada manualmente.</p><form onsubmit="updateFX(event)"><div class="cols">${formField('usdEurRate','1 USD em EUR','number',db.usdEurRate||'','min="0.000001" step="0.000001"')}${formField('fxDate','Data da cotação','date',db.fxDate||'')}</div><button class="secondary">Salvar cotação</button></form>${salaryEUR?'<p>Salário em euros: <b>'+money(salaryEUR,'EUR')+'</b></p>':''}</div></details>`;
}
if(tab==='pendencias'){
const tasks=db.tasks.filter(t=>t.trip===trip&&t.group===group).sort((a,b)=>Number(a.done)-Number(b.done));
content=panel('Minhas pendências',`<p class="muted">Lembretes pessoais deste grupo. Marque quando concluir.</p><details class="add-form"><summary>＋ Nova pendência</summary><form onsubmit="addTask(event,'general')"><label>O que preciso fazer?</label><input name="title" required placeholder="Ex.: Solicitar reembolso"><label>Prazo (opcional)</label><input type="date" name="due"><p><button class="primary">Salvar lembrete</button></p></form></details>`+taskRows(tasks));
}
if(tab==='preparacao'){
const defaults=['Conferir lista de viajantes','Verificar restrições alimentares e necessidades especiais','Revisar roteiro e passeios','Confirmar hotéis e transfers','Preparar pauta da reunião','Realizar reunião pré-viagem','Enviar orientações às viajantes','Conferir fornecedores e valores previstos'];
const key='prep:'+trip+':'+group;const checklist=db.checklists?.[key]||{};
content=panel('Antes do grupo',`<p class="muted">Checklist da preparação de ${esc(g.name)}.</p>${defaults.map((t,i)=>`<label class="check-row"><input type="checkbox" ${checklist[i]?'checked':''} onchange="checkPrep(${i},this.checked)"><span>${esc(t)}</span></label>`).join('')}<p class="hint">Os itens marcados ficam salvos neste navegador.</p>`)+panel('Minhas anotações para este grupo',`<textarea id="prepNotes" placeholder="Contatos, dúvidas, detalhes e providências específicas...">${esc(db.prepNotes?.[key]||'')}</textarea><p><button class="primary" onclick="savePrepNotes()">Salvar anotações</button></p>`)+panel('Pendências da preparação',`<details class="add-form"><summary>＋ Adicionar tarefa</summary><form onsubmit="addTask(event,'prep')"><label>Tarefa</label><input name="title" required><label>Prazo</label><input name="due" type="date"><p><button class="primary">Salvar tarefa</button></p></form></details>${taskRows(db.tasks.filter(t=>t.trip===trip&&t.group===group&&t.type==='prep'))}`);
}
if(tab==='biblioteca'){
const country=db.trips.find(t=>t.id===trip)?.country||'Tailândia';const libkey=country.toLocaleLowerCase('pt-BR');const lib=db.library[libkey]||{notes:'',meetings:'',files:[]};
content=panel('Biblioteca · '+esc(country),`<p class="muted">Seu material permanente deste país, reutilizável em todos os grupos.</p><div class="library-tabs"><button class="secondary" onclick="document.getElementById('meetingSection').scrollIntoView({behavior:'smooth'})">📝 Pautas</button><button class="secondary" onclick="document.getElementById('notesSection').scrollIntoView({behavior:'smooth'})">💡 Anotações</button><button class="secondary" onclick="document.getElementById('filesSection').scrollIntoView({behavior:'smooth'})">📎 Documentos</button></div>`)+
`<div class="panel" id="meetingSection"><h2>📝 Pautas das reuniões</h2><p class="hint">Escreva e atualize sua pauta principal do país.</p><textarea id="libraryMeetings" rows="11" placeholder="Ex.: Documentos, roteiro, roupas, moeda, aplicativos, costumes...">${esc(lib.meetings)}</textarea><p><button class="primary" onclick="saveLibrary('meetings')">Salvar pauta</button></p></div>`+
`<div class="panel" id="notesSection"><h2>💡 Anotações do destino</h2><textarea id="libraryNotes" rows="8" placeholder="Dicas, contatos, aprendizados e informações úteis...">${esc(lib.notes)}</textarea><p><button class="primary" onclick="saveLibrary('notes')">Salvar anotações</button></p></div>`+
`<div class="panel" id="filesSection"><h2>📎 Documentos</h2><p class="muted">Para não expor arquivos pessoais no GitHub, guarde aqui links privados para documentos no seu Drive, iCloud ou outro serviço de sua preferência.</p><form onsubmit="addLibraryLink(event)"><label>Nome do documento</label><input name="name" required placeholder="Ex.: Roteiro da Tailândia"><label>Link do documento (https://...)</label><input name="url" type="url" required placeholder="https://..."><p><button class="primary">Adicionar link</button></p></form>${(lib.files||[]).map(f=>`<div class="record"><div><b>${esc(f.name)}</b><a href="${esc(f.url)}" target="_blank" rel="noopener noreferrer">Abrir documento</a></div><button class="danger" onclick="removeLibraryLink('${f.id}')">Excluir</button></div>`).join('')||'<p class="hint">Nenhum documento vinculado.</p>'}<p class="hint">Nesta versão gratuita, os arquivos não são enviados ao aplicativo; apenas seus links são guardados localmente.</p></div>`;
}
if(tab==='caixa'){let cash={};[...receipts.map(r=>({...r,sign:1})),...suppliers.map(r=>({...r,sign:-1})),...transfers.map(r=>({...r,sign:-1}))].forEach(r=>cash[r.currency]=(cash[r.currency]||0)+r.sign*Number(r.amount));content=panel('Controle de caixa',`<div class="grid">${metric('Entradas',byCurrency(receipts))}${metric('Fornecedores',byCurrency(suppliers))}${metric('Repasses',byCurrency(transfers))}${metric('Saldo por moeda',Object.entries(cash).map(([c,n])=>money(n,c)).join(' · ')||'—')}</div><p class="hint">Saldo = recebimentos confirmados − fornecedores pagos − repasses realizados. Cada moeda é controlada separadamente.</p>`)+panel('Novo lançamento de caixa',`<details class="add-form"><summary>＋ Adicionar movimentação</summary><form onsubmit="addRecord(event,'cash')"><div class="cols">${selectField('kind','Tipo',[['receipt','Recebimento de viajante'],['supplier','Pagamento a fornecedor'],['transfer','Repasse à Woman Trip']])}${formField('date','Data','date',new Date().toISOString().slice(0,10))}${formField('name','Nome da viajante / fornecedor / destinatário','','','required')}${formField('amount','Valor','number','','required min="0.01" step="0.01"')}${currencyField('USD')}${formField('notes','Referência / comprovante / observação')}</div><label><input type="checkbox" name="paid" checked style="width:auto"> Dinheiro efetivamente recebido / pago / repassado</label><p><button class="primary">Salvar lançamento</button></p></form></details>`)+panel('Movimentações',recordList(rs.filter(r=>['receipt','supplier','transfer'].includes(r.kind))));}
if(tab==='despesas')content=panel('Despesas pessoais por dia',`<p class="muted">Despesas pessoais comuns não entram no reembolso. Hospedagens ficam em área própria.</p><details class="add-form"><summary>＋ Adicionar despesa</summary><form onsubmit="addRecord(event,'personal')"><div class="cols">${formField('date','Data','date',new Date().toISOString().slice(0,10))}${selectField('category','Categoria',[['Alimentação','Alimentação'],['Transporte','Transporte'],['Passeios','Passeios'],['Compras','Compras'],['Outros','Outros']])}${formField('name','Descrição','text','','required')}${formField('amount','Valor','number','','required min="0.01" step="0.01"')}${currencyField('THB')}${formField('notes','Observações')}</div><label><input type="checkbox" name="paid" checked style="width:auto"> Já pago</label><p><button class="primary">Adicionar despesa</button></p></form></details>`)+panel('Despesas registradas',`<p><b>Total por moeda:</b> ${byCurrency(personal.filter(r=>r.paid))}</p>${recordList(personal)}`);
if(tab==='hospedagens')content=panel('Hospedagens particulares / reembolsos',`<p class="muted">Somente hospedagens próprias elegíveis entram no controle de reembolso. O valor reservado não é considerado pago até confirmação.</p><details class="add-form"><summary>＋ Adicionar hospedagem</summary><form onsubmit="addRecord(event,'lodging')"><div class="cols">${formField('date','Data do check-in','date',new Date().toISOString().slice(0,10))}${formField('checkout','Data do check-out','date')}${formField('name','Nome da hospedagem','text','','required')}${formField('amount','Valor','number','','required min="0.01" step="0.01"')}${currencyField('BRL')}${formField('notes','Reserva / observações')}</div><label><input type="checkbox" name="reimbursable" checked style="width:auto"> Reembolso previsto pela Woman Trip</label><label><input type="checkbox" name="paid" style="width:auto"> Já pago</label><p><button class="primary">Salvar hospedagem</button></p></form></details>`)+panel('Hospedagens cadastradas',recordList(lodgings))+`<div id="editLodgingArea"></div>`;
if(tab==='avaliacoes')content=panel('Avaliações e melhorias',`<form onsubmit="addReview(event)"><div class="cols">${selectField('category','Área',[['Hotel','Hotel'],['Roteiro','Roteiro'],['Guia','Guia'],['Transporte','Transporte'],['Restaurante','Restaurante'],['Outro','Outro']])}${formField('date','Data','date',new Date().toISOString().slice(0,10))}${formField('name','Nome / assunto','text','','required')}${formField('pros','Pontos positivos')}${formField('cons','Pontos negativos')}${formField('suggestion','Sugestão de melhoria')}</div><p><button class="primary">Salvar avaliação</button></p></form>`)+panel('Observações registradas',db.reviews.filter(r=>r.trip===trip&&r.group===group).map(r=>`<div class="record"><div><b>${esc(r.category)} · ${esc(r.name)}</b><small>${fmt(r.date)}</small><p><b>Prós:</b> ${esc(r.pros)}<br><b>Contras:</b> ${esc(r.cons)}<br><b>Melhorias:</b> ${esc(r.suggestion)}</p></div><button class="danger" onclick="removeReview('${r.id}')">Excluir</button></div>`).join('')||'<p class="muted">Nenhuma avaliação ainda.</p>');
if(tab==='relatorio')content=panel('Relatório do grupo',`<div class="actions no-print"><button class="primary" onclick="window.print()">Imprimir / salvar PDF</button><button class="secondary" onclick="exportCSV()">Exportar lançamentos CSV</button></div><h3>${esc(g.name)} · ${fmt(g.start)} a ${fmt(g.end)}</h3><p>Diárias ${isOff?'não trabalhadas':'trabalhadas'}: ${days} × ${money(dailyUSD,'USD')} = <b>${money(salaryUSD,'USD')}</b>${salaryEUR?' · Equivalente estimado: '+money(salaryEUR,'EUR'):''} (${g.paid?'recebido':'a receber'})</p><h3>Caixa</h3><p>Recebimentos: ${byCurrency(receipts)}<br>Fornecedores: ${byCurrency(suppliers)}<br>Repasses: ${byCurrency(transfers)}</p><h3>Hospedagens reembolsáveis</h3>${recordList(lodgings.filter(r=>r.reimbursable))}<h3>Avaliações e melhorias</h3>${db.reviews.filter(r=>r.trip===trip&&r.group===group).map(r=>`<p><b>${esc(r.category)} — ${esc(r.name)}</b><br>Prós: ${esc(r.pros)}<br>Contras: ${esc(r.cons)}<br>Melhorias: ${esc(r.suggestion)}</p>`).join('')||'Nenhuma avaliação.'}`);
$('content').innerHTML=content}
function updateFX(e){e.preventDefault();const f=new FormData(e.target);db.usdEurRate=Number(f.get('usdEurRate'))||0;db.fxDate=f.get('fxDate');save()}
function updateGroup(e){e.preventDefault();let f=new FormData(e.target),g=currentGroup();g.start=f.get('start');g.end=f.get('end');g.dayType=f.get('dayType');g.rate=g.dayType==='off'?20:70;g.rateCurrency='USD';g.paid=f.has('paid');save()}
function addRecord(e,kind){e.preventDefault();let f=new FormData(e.target),r={id:uid(),trip,group,kind:kind==='cash'?f.get('kind'):kind,date:f.get('date'),name:f.get('name'),amount:+f.get('amount'),currency:f.get('currency'),notes:f.get('notes')||'',paid:f.has('paid'),reimbursable:f.has('reimbursable')};if(kind==='personal')r.name=(f.get('category')||'')+' · '+r.name;if(kind==='lodging'&&f.get('checkout'))r.notes='Check-out '+fmt(f.get('checkout'))+'. '+r.notes;db.records.push(r);save()}
function editLodging(id){
 const r=db.records.find(x=>x.id===id&&x.kind==='lodging');if(!r)return;
 const area=$('editLodgingArea');if(!area)return;
 const match=(r.notes||'').match(/Check-out (\d{2})\/(\d{2})\/(\d{4})\./);
 const checkout=match?`${match[3]}-${match[2]}-${match[1]}`:'';
 const notes=(r.notes||'').replace(/^Check-out \d{2}\/\d{2}\/\d{4}\.\s*/, '');
 area.innerHTML=panel('Editar hospedagem',`<form onsubmit="saveLodgingEdit(event,'${r.id}')"><div class="cols">${formField('date','Data do check-in','date',r.date,'required')}${formField('checkout','Data do check-out','date',checkout)}${formField('name','Nome da hospedagem','text',r.name,'required')}${formField('amount','Valor','number',r.amount,'required min="0.01" step="0.01"')}${currencyField(r.currency)}${formField('notes','Reserva / observações','text',notes)}</div><label><input type="checkbox" name="reimbursable" style="width:auto" ${r.reimbursable?'checked':''}> Reembolso previsto pela Woman Trip</label><label><input type="checkbox" name="paid" style="width:auto" ${r.paid?'checked':''}> Já pago</label><p><button class="primary">Salvar alterações</button> <button type="button" class="secondary" onclick="$('editLodgingArea').innerHTML=''">Cancelar</button></p></form>`);
 area.scrollIntoView({behavior:'smooth',block:'start'});
}
function saveLodgingEdit(e,id){
 e.preventDefault();const r=db.records.find(x=>x.id===id&&x.kind==='lodging');if(!r)return;
 const f=new FormData(e.target);const checkout=f.get('checkout');const date=f.get('date');
 if(checkout&&checkout<date){alert('O check-out não pode ser anterior ao check-in.');return}
 r.date=date;r.name=String(f.get('name')||'').trim();r.amount=Number(f.get('amount'));r.currency=f.get('currency');r.paid=f.has('paid');r.reimbursable=f.has('reimbursable');r.notes=(checkout?'Check-out '+fmt(checkout)+'. ':'')+(f.get('notes')||'');
 save();alert('Hospedagem atualizada!');
}
function addReview(e){e.preventDefault();let f=new FormData(e.target);db.reviews.push({id:uid(),trip,group,...Object.fromEntries(f.entries())});save()}
function removeRecord(id){if(confirm('Excluir este lançamento?')){db.records=db.records.filter(r=>r.id!==id);save()}}function removeReview(id){if(confirm('Excluir avaliação?')){db.reviews=db.reviews.filter(r=>r.id!==id);save()}}
function addTrip(){let country=prompt('Qual país?');if(!country?.trim())return;let name=prompt('Nome da viagem (ex.: Marrocos 2027):',country+' 2027');if(!name?.trim())return;trip=uid();db.trips.push({id:trip,country:country.trim(),name:name.trim()});group=null;save();addGroup()}
function addGroup(){if(!trip)return;let name=prompt('Nome do grupo ou período:');if(!name?.trim())return;group=uid();db.groups.push({id:group,trip,name:name.trim(),start:'',end:'',rate:70,rateCurrency:'USD',paid:false,dayType:'work'});save()}
function exportData(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='pegadas-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
async function importData(e){let file=e.target.files[0];if(!file)return;try{let obj=JSON.parse(await file.text());if(!Array.isArray(obj.trips)||!Array.isArray(obj.groups)||!Array.isArray(obj.records)||!Array.isArray(obj.reviews))throw Error('Formato inválido');if(confirm('Substituir todos os dados atuais pelo backup selecionado?')){db=obj;trip=db.trips[0]?.id;group=null;save()}}catch(err){alert('Não foi possível importar: '+err.message)}e.target.value=''}
function exportCSV(){let rows=[['Data','Tipo','Nome','Valor','Moeda','Pago','Reembolsável','Observações'],...scoped().map(r=>[r.date,kinds[r.kind],r.name,r.amount,r.currency,r.paid?'Sim':'Não',r.reimbursable?'Sim':'Não',r.notes])];let csv='\ufeff'+rows.map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(';')).join('\r\n');let a=document.createElement('a'),url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.href=url;a.download='pegadas-'+group+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}function taskRows(tasks){return tasks.length?tasks.map(t=>`<div class="record"><label class="task-label"><input type="checkbox" ${t.done?'checked':''} onchange="toggleTask('${t.id}')"><span class="${t.done?'done':''}">${esc(t.title)}<small>${t.due?fmt(t.due):'Sem prazo'}</small></span></label><button class="danger" onclick="deleteTask('${t.id}')">Excluir</button></div>`).join(''):'<p class="muted">Nenhuma tarefa cadastrada.</p>'}
function addTask(e,type){e.preventDefault();const f=new FormData(e.target);db.tasks.push({id:uid(),trip,group,title:String(f.get('title')||'').trim(),due:f.get('due'),done:false,type});save()}
function toggleTask(id){const t=db.tasks.find(t=>t.id===id);if(t){t.done=!t.done;save()}}
function deleteTask(id){if(confirm('Excluir esta tarefa?')){db.tasks=db.tasks.filter(t=>t.id!==id);save()}}
function checkPrep(i,v){db.checklists ||= {};const k='prep:'+trip+':'+group;db.checklists[k] ||= {};db.checklists[k][i]=v;save()}
function savePrepNotes(){db.prepNotes ||= {};db.prepNotes['prep:'+trip+':'+group]=$('prepNotes').value;save();alert('Anotações salvas!')}
function libraryKey(){return (db.trips.find(t=>t.id===trip)?.country||'Tailândia').toLocaleLowerCase('pt-BR')}
function getLibrary(){const k=libraryKey();db.library[k] ||= {notes:'',meetings:'',files:[]};return db.library[k]}
function saveLibrary(which){const lib=getLibrary();lib[which]=$(which==='notes'?'libraryNotes':'libraryMeetings').value;save();alert('Salvo!')}
function addLibraryLink(e){e.preventDefault();const f=new FormData(e.target);const url=String(f.get('url')||'');if(!/^https:\/\//i.test(url)){alert('Use um link HTTPS.');return}const lib=getLibrary();lib.files ||= [];lib.files.push({id:uid(),name:String(f.get('name')),url});save()}
function removeLibraryLink(id){if(confirm('Excluir o link?')){const lib=getLibrary();lib.files=lib.files.filter(f=>f.id!==id);save()}}
render();
</script></body></html>
